name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege by default; only the release job gets write access.
permissions: {}

jobs:
  # Reusable CI run at the tagged commit: the release cannot start until it
  # succeeds, and no polling or check-run race is possible.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tagged commit must be on main
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tagged commit $GITHUB_SHA is not an ancestor of origin/main" >&2; exit 1; }

      - name: Tag must equal plugin.json version
        run: |
          set -euo pipefail
          PLUGIN_VERSION="$(jq -er .version .claude-plugin/plugin.json)"
          test "$RELEASE_TAG" = "v${PLUGIN_VERSION}" \
            || { echo "tag $RELEASE_TAG != plugin.json version v${PLUGIN_VERSION}" >&2; exit 1; }
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Build allowlisted archive
        run: |
          zip -r gsd-beads.zip \
            .claude-plugin \
            .agents \
            hooks \
            capability.json \
            scripts \
            skills \
            fragments \
            GSD-CORE-PATCH.md \
            README.md \
            LICENSE \
            -x '*/__pycache__/*'

      - name: Publish release
        run: |
          set -euo pipefail
          # A rerun of the same commit must succeed (re-upload only); a moved tag
          # (different commit) must not silently republish the release. The release
          # API's targetCommitish is useless here (the tag already exists, so it reads
          # "main"), hence the commit is recorded in the notes at create time.
          if EXISTING="$(gh release view "$RELEASE_TAG" --json body --jq .body 2>/dev/null)"; then
            if printf "%s" "$EXISTING" | grep -qF "Release commit: $GITHUB_SHA"; then
              gh release upload "$RELEASE_TAG" gsd-beads.zip --clobber
              exit 0
            fi
            echo "release $RELEASE_TAG was not created from $GITHUB_SHA; delete it by hand to republish" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" gsd-beads.zip --generate-notes --notes "Release commit: $GITHUB_SHA" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
