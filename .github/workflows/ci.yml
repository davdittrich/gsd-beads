name: CI

on:
  # Branches only: a tag push is CI-checked once, by release.yml calling this workflow.
  push:
    branches: ["**"]
  pull_request:
  # Called by release.yml so a tag publishes only after CI passes on that commit.
  workflow_call:

permissions:
  contents: read

env:
  # Pinned deliberately: an upstream beads release must not be able to turn this
  # build red on its own. Bump alongside the version README's Requirements and
  # the capability's own compatibility notes claim.
  BD_VERSION: 1.2.2
  # sha256 of beads_${BD_VERSION}_linux_amd64.tar.gz; bump together with BD_VERSION.
  BD_SHA256: 8140098a51d3b81d5548d1c5e6db1a2d9930e5d141efe2a4bff7d079c4d321e8
  # sha512 (npm dist.integrity) of the pinned gsd-core npm package; bump with .github/ci/gsd-core/ (regenerate the lockfile with `npm install --package-lock-only --ignore-scripts`).
  GSD_CORE_INTEGRITY: sha512-fMjtqWQLJooD9HrkRLsfwmVmKwLN96Lea3TKTPhFl0CZ9ZFsv4Dr5f/vB0TxIgR1Hm2MgzkeMynS0MQy382N5A==
  # actionlint release asset sha256 (from the release's published checksums.txt).
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned gsd-core fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-gsd/gsd-core
          # Commit of tag v1.12.0 (tags are movable; a sha is not).
          ref: ceed559fd437b037755249e6e36ee36d0d785852
          fetch-depth: 0
          path: .ci/gsd-core

      - name: Provision pinned public gsd-core runtime
        run: |
          set -euo pipefail
          GSD_CI_CODEX_HOME="$RUNNER_TEMP/gsd-codex"
          # @opengsd/gsd-core@1.12.0 and every dependency (claude-agent-sdk, ws, ...) come
          # from the committed lockfile, which `npm ci` verifies entry by entry against its
          # sha512 integrity values; --ignore-scripts keeps lifecycle scripts out of the
          # install. The lockfile's top entry must still equal GSD_CORE_INTEGRITY.
          # npm ci fails when package.json (exact pin 1.12.0) and the lockfile disagree.
          LOCK=.github/ci/gsd-core/package-lock.json
          test "$(jq -r '.packages["node_modules/@opengsd/gsd-core"].integrity' "$LOCK")" = "$GSD_CORE_INTEGRITY" \
            || { echo "gsd-core lockfile integrity differs from GSD_CORE_INTEGRITY" >&2; exit 1; }
          NPM_DIR="$(mktemp -d)"
          cp .github/ci/gsd-core/package.json "$LOCK" "$NPM_DIR"
          (cd "$NPM_DIR" && npm ci --ignore-scripts --no-audit --no-fund)
          node "$NPM_DIR/node_modules/@opengsd/gsd-core/bin/install.js" \
            --codex --global --config-dir "$GSD_CI_CODEX_HOME" --profile=full
          GSD_IDENTITY="$(node "$GSD_CI_CODEX_HOME/gsd-core/bin/gsd-tools.cjs" runtime-identity --raw)"
          GSD_EXPECTED_IDENTITY='{"packageName":"@opengsd/gsd-core","version":"1.12.0"}'
          test "$GSD_IDENTITY" = "$GSD_EXPECTED_IDENTITY"
          echo "CODEX_HOME=$GSD_CI_CODEX_HOME" >> "$GITHUB_ENV"
          echo "GSD_CORE_REPO=$GITHUB_WORKSPACE/.ci/gsd-core" >> "$GITHUB_ENV"

      - name: Capability auto-install smoke test
        run: TMPDIR=/dev/shm bash tests/test-capability-auto-install.sh

      # test_sync.py mocks `bd`'s subprocess calls but not bd_available(), which
      # probes shutil.which("bd") -- without a real binary on PATH roughly a
      # sixth of the suite short-circuits onto the fail-open path and fails. A
      # stub will not do: _bd_on_path() is evaluated at import time and gates
      # the cases that drive a genuine bd database.
      - name: Install bd
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bd.tar.gz \
            "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz"
          echo "${BD_SHA256}  /tmp/bd.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bd.tar.gz -C /tmp bd
          sudo install -m 0755 /tmp/bd /usr/local/bin/bd
          bd version

      - name: Lint workflows (actionlint)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Session-start hook smoke test
        run: bash tests/test-session-start.sh

      # The live gsd_run / installed-workflow tests skip silently unless the
      # provisioned gsd-core is discoverable: CLAUDE_CONFIG_DIR points the test
      # helpers at it and gsd_run must resolve in a login shell. Scoped to this
      # step so the auto-install smoke test above is unaffected.
      - name: Expose gsd_run to login shells
        run: |
          set -euo pipefail
          sudo ln -sf "$CODEX_HOME/gsd-core/bin/gsd_run" /usr/local/bin/gsd_run
          bash -lc 'command -v gsd_run'

      # Stdlib unittest, not pytest -- N5 keeps this capability's dependencies
      # at `bd` plus the Python standard library, and CI must not widen that.
      - name: Beads sync tests
        env:
          CLAUDE_CONFIG_DIR: ${{ env.CODEX_HOME }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -t tests 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          # CI must prove what it claims: a skipped test is a silent hole.
          if grep -Eq '^(OK|FAILED) \(.*(skipped|expected failures)=' "$RUNNER_TEMP/unittest.log"; then
            echo "::error::unittest reported skipped tests in CI" >&2
            grep -E '^(OK|FAILED) \(' "$RUNNER_TEMP/unittest.log" >&2
            exit 1
          fi
