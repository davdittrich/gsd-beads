name: CI

on:
  push:
  pull_request:

env:
  # Pinned deliberately: an upstream beads release must not be able to turn this
  # build red on its own. Bump alongside the version README's Requirements and
  # the capability's own compatibility notes claim.
  BD_VERSION: 1.2.2

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out pinned gsd-core fixture
        uses: actions/checkout@v7
        with:
          repository: open-gsd/gsd-core
          ref: v1.12.0
          fetch-depth: 0
          path: .ci/gsd-core

      - name: Provision pinned public gsd-core runtime
        run: |
          set -euo pipefail
          GSD_CI_CODEX_HOME="$RUNNER_TEMP/gsd-codex"
          npx --yes @opengsd/gsd-core@1.12.0 \
            --codex --global --config-dir "$GSD_CI_CODEX_HOME" --profile=full
          GSD_IDENTITY="$(node "$GSD_CI_CODEX_HOME/gsd-core/bin/gsd-tools.cjs" runtime-identity --raw)"
          GSD_EXPECTED_IDENTITY='{"packageName":"@opengsd/gsd-core","version":"1.12.0"}'
          test "$GSD_IDENTITY" = "$GSD_EXPECTED_IDENTITY"
          echo "CODEX_HOME=$GSD_CI_CODEX_HOME" >> "$GITHUB_ENV"
          echo "GSD_CORE_REPO=$GITHUB_WORKSPACE/.ci/gsd-core" >> "$GITHUB_ENV"

      - name: Capability auto-install smoke test
        run: TMPDIR=/dev/shm bash tests/test-capability-auto-install.sh

      # test_sync.py mocks `bd`'s subprocess calls but not bd_available(), which
      # probes shutil.which("bd") -- without a real binary on PATH roughly a
      # sixth of the suite short-circuits onto the fail-open path and fails. A
      # stub will not do: _bd_on_path() is evaluated at import time and gates
      # the cases that drive a genuine bd database.
      - name: Install bd
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bd.tar.gz \
            "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/bd.tar.gz -C /tmp bd
          sudo install -m 0755 /tmp/bd /usr/local/bin/bd
          bd version

      # Stdlib unittest, not pytest -- N5 keeps this capability's dependencies
      # at `bd` plus the Python standard library, and CI must not widen that.
      - name: Beads sync tests
        working-directory: plugins/beads-lifecycle/.gsd/capabilities/beads
        run: python3 -m unittest discover -s tests -t tests
