name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Capability auto-install smoke test
        run: bash tests/test-capability-auto-install.sh

      # gh-2: test_sync.py's suite existed since Phase 1 but nothing ran it in
      # CI, so a regression in the sync layer reached a release unchallenged.
      # Stdlib unittest, not pytest — N5 keeps this capability's dependencies at
      # `bd` plus the Python standard library, and CI must not quietly widen
      # that. The bd-backed cases self-skip when the binary is absent, which it
      # is on this runner.
      - name: Beads sync tests
        working-directory: plugins/beads-lifecycle/.gsd/capabilities/beads
        run: python3 -m unittest discover -s tests -t tests
